<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PROTOTYPE — three Alma-inspired UI directions for lead intake." />
    <title>Alma Lead Intake — UI Prototype</title>
    <style>
      :root {
        --pine: #064c2d;
        --pine-deep: #033d24;
        --sage: #26715e;
        --sage-soft: #d9e9df;
        --apple: #e4f0c9;
        --cream: #fff8ef;
        --cloud: #f0f2ee;
        --white: #ffffff;
        --ink: #17211b;
        --muted: #687169;
        --line: #dce2dc;
        --sun: #f5d88b;
        --peach: #f2c49c;
        --danger: #a9403b;
        --shadow: 0 18px 45px rgba(12, 61, 38, 0.1);
        --shadow-soft: 0 8px 24px rgba(12, 61, 38, 0.07);
        --radius: 16px;
        --radius-small: 10px;
        --page: min(1320px, calc(100vw - 64px));
      }

      * { box-sizing: border-box; }
      html { background: var(--cream); }
      body {
        margin: 0;
        color: var(--ink);
        background: var(--cream);
        font-family: "Avenir Next", Avenir, "Helvetica Neue", Helvetica, Arial, sans-serif;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
      }
      button, input, select { font: inherit; }
      button, a { -webkit-tap-highlight-color: transparent; }
      button { cursor: pointer; }
      .prototype-root { min-height: 100vh; padding-bottom: 108px; }
      .logo { width: 104px; height: auto; display: block; }
      .logo--white { filter: brightness(0) invert(1); }
      .eyebrow {
        color: var(--sage);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: .13em;
        text-transform: uppercase;
      }
      .muted { color: var(--muted); }
      .tiny { font-size: 12px; }
      .small { font-size: 14px; }
      h1, h2, h3, p { margin-top: 0; }
      h1, h2, h3 { letter-spacing: -.035em; line-height: 1.08; }
      h1 { font-size: clamp(42px, 6vw, 76px); font-weight: 590; }
      h2 { font-size: clamp(28px, 3.5vw, 44px); font-weight: 600; }
      h3 { font-size: 20px; font-weight: 650; }
      .primary, .secondary, .ghost, .icon-button {
        border: 0;
        border-radius: 10px;
        min-height: 44px;
        padding: 0 18px;
        font-weight: 700;
        transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
      }
      .primary { color: white; background: var(--pine); box-shadow: 0 8px 18px rgba(6,76,45,.18); }
      .primary:hover { background: var(--pine-deep); transform: translateY(-1px); }
      .secondary { color: var(--pine); background: var(--apple); }
      .ghost { color: var(--pine); background: transparent; border: 1px solid var(--line); }
      .button-wide { width: 100%; }
      .field { display: grid; gap: 7px; }
      .field label { font-size: 13px; font-weight: 700; color: #344038; }
      .field input, .field select {
        width: 100%;
        min-height: 48px;
        border: 1px solid #cfd7d0;
        border-radius: 10px;
        padding: 0 14px;
        color: var(--ink);
        background: white;
        outline: none;
        transition: border-color .15s ease, box-shadow .15s ease;
      }
      .field input:focus, .field select:focus { border-color: var(--sage); box-shadow: 0 0 0 3px rgba(38,113,94,.12); }
      .upload {
        min-height: 118px;
        border: 1.5px dashed #aab9ad;
        border-radius: 12px;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 18px;
        background: #fbfdf9;
      }
      .upload-mark { width: 34px; height: 34px; display: grid; place-items: center; margin: 0 auto 8px; border-radius: 50%; color: var(--pine); background: var(--apple); font-weight: 900; }
      .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      .form-stack { display: grid; gap: 18px; }
      .span-2 { grid-column: 1 / -1; }
      .privacy { display: flex; gap: 9px; align-items: flex-start; color: var(--muted); font-size: 12px; }
      .privacy svg { flex: none; margin-top: 1px; }
      .status { display: inline-flex; align-items: center; gap: 7px; min-height: 26px; padding: 0 10px; border-radius: 999px; font-size: 11px; font-weight: 800; letter-spacing: .02em; white-space: nowrap; }
      .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
      .status.pending { color: #765716; background: #fff2c9; }
      .status.reached { color: #1a684d; background: #dcefe5; }
      .status.unassigned { color: #7a4235; background: #f8e2d7; }
      .duplicate { color: #664d1b; background: #f8ebc5; padding: 5px 8px; border-radius: 7px; font-size: 11px; font-weight: 800; }
      .avatar { width: 34px; height: 34px; display: grid; place-items: center; flex: none; border-radius: 50%; color: white; background: var(--sage); font-size: 12px; font-weight: 800; }
      .avatar.apple { color: var(--pine); background: var(--apple); }
      .avatar.sun { color: #664d1b; background: var(--sun); }
      .avatar.peach { color: #7a4235; background: var(--peach); }
      .person { display: flex; gap: 10px; align-items: center; }
      .person strong { display: block; font-size: 13px; }
      .person span { display: block; color: var(--muted); font-size: 11px; }
      .surface-shell { min-height: calc(100vh - 108px); }

      /* Variant A — Guided calm */
      .a-public { position: relative; overflow: hidden; min-height: calc(100vh - 108px); background: var(--apple); }
      .a-public::before, .a-public::after { content: ""; position: absolute; border-radius: 50%; pointer-events: none; }
      .a-public::before { width: 520px; height: 520px; right: -240px; top: -210px; border: 110px solid rgba(6,76,45,.10); }
      .a-public::after { width: 340px; height: 340px; left: -190px; bottom: -230px; border: 82px solid rgba(255,255,255,.45); }
      .a-nav { width: var(--page); margin: auto; padding: 34px 0; display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 2; }
      .a-public-grid { width: var(--page); margin: 0 auto; padding: 36px 0 70px; display: grid; grid-template-columns: 1.05fr .95fr; gap: clamp(46px, 7vw, 112px); align-items: center; position: relative; z-index: 2; }
      .a-copy p { max-width: 570px; color: #38533f; font-size: 18px; }
      .trust-row { display: flex; gap: 22px; margin-top: 34px; color: #33523d; font-size: 13px; font-weight: 700; }
      .trust-row span { display: flex; gap: 7px; align-items: center; }
      .a-form-card { padding: clamp(24px, 3vw, 38px); border-radius: 18px; background: white; box-shadow: var(--shadow); }
      .a-form-card h2 { font-size: 30px; margin-bottom: 8px; }
      .a-admin { min-height: calc(100vh - 108px); display: grid; grid-template-columns: 232px 1fr; background: var(--cloud); }
      .a-sidebar { background: var(--pine); color: white; padding: 34px 22px; display: flex; flex-direction: column; gap: 38px; }
      .a-sidebar-nav { display: grid; gap: 8px; }
      .a-sidebar-nav button { border: 0; color: rgba(255,255,255,.74); background: transparent; min-height: 44px; border-radius: 9px; text-align: left; padding: 0 12px; font-weight: 650; }
      .a-sidebar-nav button.active { color: var(--pine); background: var(--apple); }
      .a-main { padding: 38px clamp(28px, 4vw, 64px); overflow: hidden; }
      .admin-top { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-bottom: 30px; }
      .admin-top h2 { margin-bottom: 5px; }
      .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-bottom: 24px; }
      .stat { padding: 20px; border: 1px solid #e0e5e0; border-radius: 13px; background: rgba(255,255,255,.8); }
      .stat span { color: var(--muted); font-size: 12px; font-weight: 700; }
      .stat strong { display: block; margin-top: 8px; color: var(--pine); font-size: 30px; letter-spacing: -.04em; }
      .table-card { overflow: hidden; border: 1px solid #dde3de; border-radius: 14px; background: white; box-shadow: var(--shadow-soft); }
      .table-toolbar { padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e6eae6; }
      .filters { display: flex; gap: 8px; }
      .filter { border: 0; border-radius: 999px; padding: 7px 11px; color: var(--muted); background: var(--cloud); font-size: 12px; font-weight: 700; }
      .filter.active { color: var(--pine); background: var(--apple); }
      table { width: 100%; border-collapse: collapse; }
      th { padding: 13px 16px; color: #7a847c; background: #fafbfa; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; text-align: left; }
      td { padding: 15px 16px; border-top: 1px solid #edf0ed; font-size: 13px; vertical-align: middle; }
      tr[data-detail] { cursor: pointer; transition: background .12s ease; }
      tr[data-detail]:hover { background: #f7faf7; }
      .a-detail { min-height: calc(100vh - 108px); background: var(--cloud); }
      .a-detail-nav { padding: 26px max(32px, calc((100vw - 1240px)/2)); display: flex; justify-content: space-between; align-items: center; background: white; border-bottom: 1px solid var(--line); }
      .detail-wrap { width: min(1180px, calc(100vw - 64px)); margin: 34px auto; }
      .back-link { border: 0; color: var(--pine); background: none; font-weight: 750; padding: 0; margin-bottom: 20px; }
      .detail-title { display: flex; align-items: start; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
      .detail-title h2 { margin-bottom: 7px; }
      .detail-grid { display: grid; grid-template-columns: 1.25fr .75fr; gap: 20px; }
      .panel { padding: 24px; border: 1px solid var(--line); border-radius: 14px; background: white; box-shadow: var(--shadow-soft); }
      .contact-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
      .data-label { color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; }
      .data-value { margin-top: 5px; font-size: 15px; font-weight: 700; }
      .resume-card { margin-top: 22px; padding: 16px; display: flex; gap: 14px; align-items: center; border-radius: 11px; background: var(--cloud); }
      .doc-icon { width: 42px; height: 48px; display: grid; place-items: center; border-radius: 7px; color: white; background: var(--sage); font-size: 12px; font-weight: 900; }
      .timeline { display: grid; gap: 0; }
      .timeline-item { position: relative; padding: 0 0 24px 25px; }
      .timeline-item:not(:last-child)::before { content: ""; position: absolute; left: 5px; top: 12px; bottom: -2px; width: 1px; background: #cfdbd2; }
      .timeline-dot { position: absolute; left: 0; top: 4px; width: 11px; height: 11px; border: 3px solid white; border-radius: 50%; background: var(--sage); box-shadow: 0 0 0 1px var(--sage); }

      /* Variant B — Focused workflow */
      .b-public { min-height: calc(100vh - 108px); background: var(--cream); }
      .b-nav { width: min(1120px, calc(100vw - 48px)); margin: auto; padding: 30px 0; display: flex; justify-content: space-between; align-items: center; }
      .b-public-inner { width: min(760px, calc(100vw - 48px)); margin: 28px auto 0; text-align: center; }
      .b-public-inner h1 { font-size: clamp(38px, 5vw, 58px); margin-bottom: 14px; }
      .b-public-inner > p { max-width: 600px; margin: 0 auto 30px; color: var(--muted); font-size: 17px; }
      .step-card { text-align: left; padding: 34px; border: 1px solid #e4e1da; border-radius: 22px; background: white; box-shadow: var(--shadow); }
      .steps { display: flex; gap: 0; margin-bottom: 30px; }
      .step { position: relative; flex: 1; color: var(--muted); font-size: 12px; font-weight: 800; }
      .step::before { content: ""; display: block; width: 100%; height: 3px; margin-bottom: 9px; background: #e5e9e4; }
      .step.active { color: var(--pine); }
      .step.active::before { background: var(--pine); }
      .step-copy { display: flex; justify-content: space-between; gap: 24px; align-items: end; margin-bottom: 24px; }
      .step-copy h2 { font-size: 28px; margin-bottom: 5px; }
      .step-view[hidden] { display: none; }
      .b-admin { min-height: calc(100vh - 108px); background: #eef2ee; }
      .b-topbar { height: 76px; padding: 0 max(28px, calc((100vw - 1320px)/2)); display: flex; align-items: center; justify-content: space-between; background: white; border-bottom: 1px solid var(--line); }
      .b-workspace { width: min(1320px, calc(100vw - 48px)); height: calc(100vh - 184px); min-height: 620px; margin: 22px auto; display: grid; grid-template-columns: 360px 1fr; overflow: hidden; border: 1px solid var(--line); border-radius: 18px; background: white; box-shadow: var(--shadow-soft); }
      .inbox { border-right: 1px solid var(--line); overflow: auto; }
      .inbox-head { position: sticky; top: 0; z-index: 2; padding: 20px; background: white; border-bottom: 1px solid var(--line); }
      .inbox-head h3 { margin-bottom: 14px; }
      .search { width: 100%; min-height: 40px; border: 1px solid var(--line); border-radius: 9px; padding: 0 12px; background: var(--cloud); }
      .lead-row { padding: 17px 20px; display: grid; gap: 8px; border-bottom: 1px solid #edf0ed; cursor: pointer; }
      .lead-row:hover, .lead-row.active { background: #f1f6eb; }
      .lead-row-top { display: flex; justify-content: space-between; gap: 10px; }
      .lead-row-meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }
      .focus-detail { padding: 34px 42px; overflow: auto; }
      .focus-actions { display: flex; gap: 10px; }
      .focus-title { display: flex; justify-content: space-between; gap: 20px; padding-bottom: 24px; border-bottom: 1px solid var(--line); }
      .focus-title h2 { margin-bottom: 8px; }
      .focus-columns { display: grid; grid-template-columns: 1fr 280px; gap: 36px; padding-top: 28px; }
      .section-title { margin: 0 0 16px; color: var(--muted); font-size: 11px; font-weight: 850; letter-spacing: .12em; text-transform: uppercase; }
      .info-list { display: grid; gap: 14px; }
      .info-row { display: flex; justify-content: space-between; gap: 20px; padding-bottom: 13px; border-bottom: 1px solid #edf0ed; font-size: 13px; }
      .info-row span { color: var(--muted); }
      .b-detail { min-height: calc(100vh - 108px); background: var(--pine); padding: 30px; }
      .b-detail-card { width: min(1180px, 100%); min-height: calc(100vh - 168px); margin: auto; display: grid; grid-template-columns: 1.1fr .9fr; overflow: hidden; border-radius: 20px; background: white; }
      .b-detail-main { padding: 42px; }
      .b-detail-side { padding: 42px; background: var(--apple); }

      /* Variant C — Operational clarity */
      .c-public { min-height: calc(100vh - 108px); background: white; }
      .c-nav { padding: 24px max(28px, calc((100vw - 1240px)/2)); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); }
      .c-public-intro { width: min(1180px, calc(100vw - 56px)); margin: 54px auto 30px; display: flex; justify-content: space-between; gap: 40px; align-items: end; }
      .c-public-intro h1 { max-width: 720px; margin: 8px 0 0; font-size: clamp(38px, 5vw, 64px); }
      .c-public-intro p { max-width: 360px; margin: 0; color: var(--muted); }
      .c-form-band { padding: 36px 0 54px; background: var(--cream); border-top: 1px solid #eee7df; }
      .c-form { width: min(1180px, calc(100vw - 56px)); margin: auto; display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 18px; align-items: end; }
      .c-form .upload { min-height: 94px; }
      .c-form-footer { width: min(1180px, calc(100vw - 56px)); margin: 20px auto 0; display: flex; justify-content: space-between; gap: 20px; align-items: center; }
      .c-admin { min-height: calc(100vh - 108px); background: var(--cream); }
      .c-admin-header { padding: 26px max(28px, calc((100vw - 1320px)/2)); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e5dfd7; background: white; }
      .c-admin-header-nav { display: flex; gap: 8px; }
      .c-admin-main { width: min(1320px, calc(100vw - 48px)); margin: 30px auto; }
      .c-title-row { display: flex; justify-content: space-between; gap: 20px; align-items: end; margin-bottom: 22px; }
      .c-title-row h2 { margin-bottom: 6px; }
      .queue-metrics { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 14px; margin-bottom: 18px; }
      .queue-metric { min-height: 132px; padding: 22px; border-radius: 15px; background: var(--apple); }
      .queue-metric:nth-child(2) { background: var(--sun); }
      .queue-metric:nth-child(3) { background: var(--sage-soft); }
      .queue-metric strong { display: block; margin: 10px 0 2px; font-size: 34px; letter-spacing: -.05em; }
      .queue-layout { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
      .queue-column { padding: 15px; border: 1px solid var(--line); border-radius: 15px; background: rgba(255,255,255,.75); }
      .queue-head { display: flex; justify-content: space-between; padding: 3px 4px 14px; font-size: 13px; font-weight: 800; }
      .lead-card { padding: 15px; margin-bottom: 10px; border: 1px solid #e1e6e1; border-radius: 11px; background: white; box-shadow: 0 5px 12px rgba(6,76,45,.04); cursor: pointer; }
      .lead-card:hover { border-color: #b4c7b8; }
      .lead-card-title { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 9px; }
      .lead-card-meta { color: var(--muted); font-size: 11px; }
      .c-detail { min-height: calc(100vh - 108px); background: var(--cream); }
      .c-detail-inner { width: min(1040px, calc(100vw - 48px)); margin: auto; padding: 36px 0 60px; }
      .c-dossier { display: grid; grid-template-columns: 300px 1fr; gap: 18px; }
      .profile-panel { padding: 24px; border-radius: 16px; color: white; background: var(--pine); }
      .profile-initials { width: 62px; height: 62px; display: grid; place-items: center; margin-bottom: 26px; border-radius: 50%; color: var(--pine); background: var(--apple); font-size: 20px; font-weight: 800; }
      .profile-panel .data-label { color: rgba(255,255,255,.62); }
      .profile-panel .data-value { margin-bottom: 19px; }
      .dossier-main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
      .dossier-main .panel { min-width: 0; }
      .resume-card > div { min-width: 0; }
      .resume-card strong { overflow-wrap: anywhere; }

      /* Prototype controls */
      .prototype-switcher {
        position: fixed;
        left: 50%;
        bottom: 20px;
        z-index: 100;
        transform: translateX(-50%);
        width: min(720px, calc(100vw - 24px));
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px;
        border: 1px solid rgba(255,255,255,.15);
        border-radius: 16px;
        color: white;
        background: rgba(15, 24, 18, .94);
        box-shadow: 0 18px 50px rgba(0,0,0,.25);
        backdrop-filter: blur(18px);
      }
      .switch-arrow { width: 42px; height: 42px; flex: none; border: 0; border-radius: 10px; color: white; background: rgba(255,255,255,.10); font-size: 20px; }
      .switch-copy { min-width: 145px; padding: 0 7px; }
      .switch-copy strong { display: block; font-size: 12px; }
      .switch-copy span { color: rgba(255,255,255,.62); font-size: 10px; }
      .surface-tabs { flex: 1; display: flex; gap: 4px; justify-content: flex-end; }
      .surface-tab { min-height: 40px; border: 0; border-radius: 9px; padding: 0 12px; color: rgba(255,255,255,.67); background: transparent; font-size: 11px; font-weight: 750; white-space: nowrap; }
      .surface-tab.active { color: #173a26; background: var(--apple); }
      .success-toast { position: fixed; right: 22px; top: 22px; z-index: 90; width: min(360px, calc(100vw - 44px)); padding: 18px; border-radius: 13px; color: white; background: var(--pine); box-shadow: var(--shadow); animation: toast-in .25s ease both; }
      @keyframes toast-in { from { opacity: 0; transform: translateY(-8px); } }

      @media (max-width: 980px) {
        :root { --page: min(100% - 40px, 760px); }
        .a-public-grid { grid-template-columns: 1fr; gap: 34px; }
        .a-copy { text-align: center; }
        .a-copy p { margin-left: auto; margin-right: auto; }
        .trust-row { justify-content: center; flex-wrap: wrap; }
        .a-admin { grid-template-columns: 82px 1fr; }
        .a-sidebar { padding: 28px 12px; }
        .a-sidebar .logo { width: 58px; }
        .a-sidebar-nav button { font-size: 0; text-align: center; }
        .a-sidebar-nav button::first-letter { font-size: 14px; }
        .detail-grid, .b-detail-card, .focus-columns, .c-dossier { grid-template-columns: minmax(0, 1fr); }
        .profile-panel, .dossier-main { min-width: 0; }
        .profile-panel .data-value { overflow-wrap: anywhere; }
        .b-workspace { grid-template-columns: 300px 1fr; }
        .queue-layout { grid-template-columns: 1fr 1fr; }
        .queue-column:last-child { grid-column: 1 / -1; }
        .c-form { grid-template-columns: 1fr 1fr; }
        .c-form .upload { grid-column: 1 / -1; }
      }

      @media (max-width: 720px) {
        :root { --page: calc(100vw - 32px); }
        .prototype-root { padding-bottom: 132px; }
        .logo { width: 82px; }
        .a-nav, .b-nav, .c-nav { padding-top: 54px; }
        .form-grid, .contact-grid, .stats, .queue-metrics, .queue-layout, .c-form { grid-template-columns: 1fr; }
        .span-2 { grid-column: auto; }
        .a-public-grid { padding-top: 14px; }
        .a-public-grid h1 { font-size: 42px; }
        .a-admin { display: block; }
        .a-sidebar { padding: 56px 18px 14px; flex-direction: row; align-items: center; justify-content: space-between; }
        .a-sidebar-nav { display: flex; }
        .a-sidebar-nav button { min-height: 36px; padding: 0 8px; font-size: 10px; }
        .a-main { padding: 22px 16px; }
        .admin-top, .detail-title, .focus-title, .c-title-row, .c-public-intro { align-items: stretch; flex-direction: column; }
        .stats { gap: 9px; }
        .stat { padding: 14px; }
        .table-card { border: 0; background: transparent; box-shadow: none; overflow: visible; }
        .table-toolbar { padding: 0 0 12px; border: 0; }
        table, thead, tbody, tr, td { display: block; }
        thead { display: none; }
        tr { margin-bottom: 10px; padding: 15px; border: 1px solid var(--line); border-radius: 12px; background: white; }
        td { display: flex; justify-content: space-between; border: 0; padding: 5px 0; }
        .hide-mobile { display: none !important; }
        .b-workspace { height: auto; min-height: 0; grid-template-columns: 1fr; }
        .inbox { max-height: 430px; border-right: 0; border-bottom: 1px solid var(--line); }
        .focus-detail { padding: 25px 20px; }
        .b-detail, .b-detail-main, .b-detail-side { padding: 20px; }
        .b-detail-card { min-height: auto; }
        .c-public-intro { margin-top: 32px; }
        .c-form .upload { grid-column: auto; }
        .c-form-footer { align-items: stretch; flex-direction: column; }
        .queue-column:last-child { grid-column: auto; }
        .prototype-switcher { bottom: 10px; flex-wrap: wrap; justify-content: center; }
        .surface-tabs { order: 3; flex-basis: 100%; justify-content: center; }
        .switch-copy { flex: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <div id="app" class="prototype-root"></div>
    <script>
      // PROTOTYPE — Three variants of the public intake and Attorney workspace,
      // switchable via ?variant= and ?surface= on this single route.
      const variants = {
        A: { name: "Guided calm", description: "Reassuring intake, table-first operations" },
        B: { name: "Focused workflow", description: "Staged intake, inbox-style review" },
        C: { name: "Operational clarity", description: "Compact intake, queue overview" },
      };
      const surfaces = ["public", "admin", "detail"];
      const params = new URLSearchParams(window.location.search);
      let variant = variants[params.get("variant")] ? params.get("variant") : "A";
      let surface = surfaces.includes(params.get("surface")) ? params.get("surface") : "public";

      const leads = [
        { initials: "MP", name: "Maya Patel", email: "maya.patel@example.com", status: "PENDING", time: "8 min ago", duplicate: 2, assignee: "You" },
        { initials: "JL", name: "Jordan Lee", email: "jordan.lee@example.com", status: "PENDING", time: "26 min ago", duplicate: 0, assignee: "You" },
        { initials: "SO", name: "Samuel Ortiz", email: "samuel.o@example.com", status: "REACHED_OUT", time: "1 hr ago", duplicate: 0, assignee: "You" },
        { initials: "AK", name: "Avery Kim", email: "avery.kim@example.com", status: "PENDING", time: "2 hrs ago", duplicate: 1, assignee: "Noah Williams" },
        { initials: "NM", name: "Nina Mensah", email: "nina.m@example.com", status: "PENDING", time: "3 hrs ago", duplicate: 0, assignee: "Unassigned" },
        { initials: "RW", name: "Riley Wong", email: "riley.w@example.com", status: "REACHED_OUT", time: "Yesterday", duplicate: 0, assignee: "Sofia Chen" },
      ];

      function logo(extra = "") { return `<img class="logo ${extra}" src="./alma-logo.png" alt="Alma" />`; }
      function shield() { return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3l7 3v5c0 4.7-2.8 8.2-7 10-4.2-1.8-7-5.3-7-10V6l7-3z" stroke="currentColor" stroke-width="1.8"/><path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="1.8"/></svg>`; }
      function status(value) { return `<span class="status ${value === "PENDING" ? "pending" : "reached"}">${value === "PENDING" ? "Pending" : "Reached out"}</span>`; }
      function upload() { return `<div class="upload"><div><div class="upload-mark">↑</div><strong class="small">Upload résumé or CV</strong><div class="tiny muted">PDF, DOC, or DOCX · 5 MB max</div></div></div>`; }
      function privacy() { return `<div class="privacy">${shield()}<span>Your information is kept private and used only so our legal team can contact you. Protected by Cloudflare Turnstile.</span></div>`; }
      function standardFields() {
        return `<div class="form-grid">
          <div class="field"><label>First name</label><input value="Maya" aria-label="First name" /></div>
          <div class="field"><label>Last name</label><input value="Patel" aria-label="Last name" /></div>
          <div class="field span-2"><label>Email address</label><input type="email" value="maya.patel@example.com" aria-label="Email address" /></div>
          <div class="span-2">${upload()}</div>
        </div>`;
      }
      function submitButton(label = "Submit your information") { return `<button class="primary button-wide" data-submit>${label} <span aria-hidden="true">→</span></button>`; }
      function navActions() { return `<span class="small muted">Already submitted? <strong style="color:var(--pine)">Contact our team</strong></span>`; }

      function publicA() {
        return `<main class="surface-shell a-public">
          <nav class="a-nav">${logo()}${navActions()}</nav>
          <section class="a-public-grid">
            <div class="a-copy">
              <div class="eyebrow">Start your journey</div>
              <h1>Let’s understand how we can help.</h1>
              <p>Share a few details with our legal team. An attorney will review your information and reach out personally.</p>
              <div class="trust-row"><span>✓ Takes about 3 minutes</span><span>✓ Secure résumé upload</span><span>✓ Attorney reviewed</span></div>
            </div>
            <form class="a-form-card form-stack" data-form>
              <div><h2>Tell us about yourself</h2><p class="muted small">All fields are required.</p></div>
              ${standardFields()}
              ${privacy()}
              ${submitButton()}
            </form>
          </section>
        </main>`;
      }

      function publicB() {
        return `<main class="surface-shell b-public">
          <nav class="b-nav">${logo()}${navActions()}</nav>
          <section class="b-public-inner">
            <div class="eyebrow">Confidential lead intake</div>
            <h1>A clearer path starts with a conversation.</h1>
            <p>Tell us who you are, then securely share your résumé. Our team will take it from there.</p>
            <form class="step-card" data-form>
              <div class="steps"><div class="step active" data-step-label="1">01 &nbsp; Contact</div><div class="step" data-step-label="2">02 &nbsp; Résumé</div></div>
              <div class="step-view" data-step="1">
                <div class="step-copy"><div><h2>Your details</h2><span class="small muted">How should we reach you?</span></div><span class="tiny muted">Step 1 of 2</span></div>
                <div class="form-grid">
                  <div class="field"><label>First name</label><input value="Maya" /></div>
                  <div class="field"><label>Last name</label><input value="Patel" /></div>
                  <div class="field span-2"><label>Email address</label><input value="maya.patel@example.com" /></div>
                </div>
                <div style="margin-top:24px"><button type="button" class="primary button-wide" data-next-step>Continue to résumé →</button></div>
              </div>
              <div class="step-view" data-step="2" hidden>
                <div class="step-copy"><div><h2>Add your résumé</h2><span class="small muted">One final step.</span></div><button type="button" class="ghost" data-prev-step>← Back</button></div>
                ${upload()}
                <div style="margin:18px 0">${privacy()}</div>
                ${submitButton("Send to our legal team")}
              </div>
            </form>
          </section>
        </main>`;
      }

      function publicC() {
        return `<main class="surface-shell c-public">
          <nav class="c-nav">${logo()}<span class="eyebrow">Secure attorney intake</span></nav>
          <section class="c-public-intro">
            <div><div class="eyebrow">Begin here</div><h1>Share your information with our legal team.</h1></div>
            <p>A concise, secure intake. Your submission goes directly to an attorney for review.</p>
          </section>
          <form class="c-form-band" data-form>
            <div class="c-form">
              <div class="field"><label>First name</label><input value="Maya" /></div>
              <div class="field"><label>Last name</label><input value="Patel" /></div>
              <div class="field"><label>Email address</label><input value="maya.patel@example.com" /></div>
              <div class="field"><label>Résumé or CV</label>${upload()}</div>
              <div style="grid-column:2/-1; display:grid; gap:14px; align-self:stretch; align-content:end">${privacy()}${submitButton("Submit securely")}</div>
            </div>
            <div class="c-form-footer"><span class="small"><strong>What happens next?</strong> An attorney reviews your submission and contacts you directly.</span><span class="tiny muted">Encrypted in transit · Private document storage</span></div>
          </form>
        </main>`;
      }

      function leadRows() {
        return leads.slice(0,5).map((lead, index) => `<tr data-detail>
          <td><div class="person"><span class="avatar ${index % 3 === 1 ? "sun" : index % 3 === 2 ? "peach" : "apple"}">${lead.initials}</span><div><strong>${lead.name}</strong><span>${lead.email}</span></div></div></td>
          <td>${status(lead.status)}</td>
          <td class="hide-mobile">${lead.duplicate ? `<span class="duplicate">${lead.duplicate} previous</span>` : `<span class="muted">—</span>`}</td>
          <td class="hide-mobile"><span class="small">${lead.assignee}</span></td>
          <td><span class="muted small">${lead.time}</span></td>
        </tr>`).join("");
      }

      function adminA() {
        return `<main class="surface-shell a-admin">
          <aside class="a-sidebar">${logo("logo--white")}<div class="a-sidebar-nav"><button class="active">My Leads&nbsp;&nbsp; 18</button><button>Unassigned&nbsp;&nbsp; 2</button><button>All Leads</button></div><div style="margin-top:auto" class="person"><span class="avatar apple">JS</span><div class="hide-mobile"><strong>Jamie Shah</strong><span style="color:rgba(255,255,255,.6)">Attorney</span></div></div></aside>
          <section class="a-main">
            <header class="admin-top"><div><div class="eyebrow">Attorney workspace</div><h2>My Leads</h2><span class="muted small">Your assigned follow-up queue</span></div><button class="ghost">Export view</button></header>
            <div class="stats"><div class="stat"><span>Pending follow-up</span><strong>12</strong></div><div class="stat"><span>Reached out today</span><strong>6</strong></div><div class="stat"><span>Possible duplicates</span><strong>3</strong></div></div>
            <div class="table-card"><div class="table-toolbar"><div class="filters"><button class="filter active">All</button><button class="filter">Pending</button><button class="filter">Reached out</button></div><span class="tiny muted">50 per page</span></div><table><thead><tr><th>Prospect</th><th>Status</th><th>Previous</th><th>Assigned to</th><th>Submitted</th></tr></thead><tbody>${leadRows()}</tbody></table></div>
          </section>
        </main>`;
      }

      function inboxRows() {
        return leads.map((lead, index) => `<div class="lead-row ${index === 0 ? "active" : ""}" data-detail><div class="lead-row-top"><strong>${lead.name}</strong>${status(lead.status)}</div><div class="small muted">${lead.email}</div><div class="lead-row-meta"><span>${lead.assignee}</span><span>${lead.time}</span></div></div>`).join("");
      }

      function compactTimeline() {
        return `<div class="timeline"><div class="timeline-item"><span class="timeline-dot"></span><strong class="small">Marked reached out</strong><div class="tiny muted">Jamie Shah · Today, 10:42 AM</div></div><div class="timeline-item"><span class="timeline-dot"></span><strong class="small">Submitted · Pending</strong><div class="tiny muted">System · Today, 9:18 AM</div></div></div>`;
      }

      function adminB() {
        return `<main class="surface-shell b-admin"><header class="b-topbar">${logo()}<div class="person"><span class="avatar">JS</span><div><strong>Jamie Shah</strong><span>Attorney</span></div></div></header>
          <section class="b-workspace"><aside class="inbox"><div class="inbox-head"><h3>My Leads <span class="muted">18</span></h3><input class="search" placeholder="Search by email" /><div class="filters" style="margin-top:10px"><button class="filter active">My Leads</button><button class="filter">Unassigned 2</button><button class="filter">All</button></div></div>${inboxRows()}</aside>
          <article class="focus-detail"><div class="focus-title"><div><div class="eyebrow">Lead · Submitted 8 min ago</div><h2>Maya Patel</h2><span class="small muted">maya.patel@example.com</span></div><div class="focus-actions"><button class="ghost">Download CV</button><button class="primary">Mark reached out</button></div></div>
          <div class="focus-columns"><div><div class="section-title">Lead information</div><div class="info-list"><div class="info-row"><span>First name</span><strong>Maya</strong></div><div class="info-row"><span>Last name</span><strong>Patel</strong></div><div class="info-row"><span>Email</span><strong>maya.patel@example.com</strong></div><div class="info-row"><span>Résumé</span><strong style="color:var(--pine)">Maya_Patel_CV.pdf ↓</strong></div></div><div style="margin-top:28px"><div class="section-title">Possible duplicates</div><div class="panel" style="padding:15px"><strong class="small">2 earlier submissions</strong><div class="tiny muted">Jul 18 · Reached out &nbsp;·&nbsp; Mar 02 · Pending</div></div></div></div><aside><div class="section-title">Assignment</div><div class="person" style="margin-bottom:28px"><span class="avatar">JS</span><div><strong>Jamie Shah</strong><span>Assigned attorney</span></div></div><div class="section-title">Status history</div>${compactTimeline()}</aside></div></article></section></main>`;
      }

      function leadCards(items) {
        return items.map((lead) => `<article class="lead-card" data-detail><div class="lead-card-title"><strong>${lead.name}</strong>${status(lead.status)}</div><div class="lead-card-meta">${lead.email}</div><div class="lead-card-meta" style="margin-top:8px; display:flex; justify-content:space-between"><span>${lead.duplicate ? lead.duplicate + " previous" : "First submission"}</span><span>${lead.time}</span></div></article>`).join("");
      }

      function adminC() {
        return `<main class="surface-shell c-admin"><header class="c-admin-header">${logo()}<div class="c-admin-header-nav"><button class="filter active">My Leads</button><button class="filter">Unassigned <strong>2</strong></button><button class="filter">All Leads</button></div><span class="avatar">JS</span></header>
          <section class="c-admin-main"><div class="c-title-row"><div><div class="eyebrow">Sunday, August 30</div><h2>Your follow-up queue</h2><span class="muted small">Prioritized by newest submission</span></div><div class="filters"><button class="ghost">Search email</button><button class="ghost">Filters</button></div></div>
          <div class="queue-metrics"><div class="queue-metric"><span class="small">Assigned to you</span><strong>18</strong><span class="tiny">12 still pending</span></div><div class="queue-metric"><span class="small">Reached out today</span><strong>6</strong><span class="tiny">Up 2 from yesterday</span></div><div class="queue-metric"><span class="small">Shared queue</span><strong>2</strong><span class="tiny">Unassigned Leads</span></div></div>
          <div class="queue-layout"><section class="queue-column"><div class="queue-head"><span>Needs attention</span><span>3</span></div>${leadCards(leads.slice(0,2))}</section><section class="queue-column"><div class="queue-head"><span>Recent</span><span>8</span></div>${leadCards(leads.slice(2,4))}</section><section class="queue-column"><div class="queue-head"><span>Reached out</span><span>6</span></div>${leadCards(leads.slice(4,6))}</section></div></section></main>`;
      }

      function detailCore() {
        return `<div class="contact-grid"><div><div class="data-label">First name</div><div class="data-value">Maya</div></div><div><div class="data-label">Last name</div><div class="data-value">Patel</div></div><div><div class="data-label">Email</div><div class="data-value">maya.patel@example.com</div></div><div><div class="data-label">Submitted</div><div class="data-value">Today, 9:18 AM</div></div></div><div class="resume-card"><span class="doc-icon">PDF</span><div style="flex:1"><strong class="small">Maya_Patel_CV.pdf</strong><div class="tiny muted">PDF · 1.8 MB</div></div><button class="ghost">Download</button></div>`;
      }

      function detailA() {
        return `<main class="surface-shell a-detail"><header class="a-detail-nav">${logo()}<div class="person"><span class="avatar">JS</span><div><strong>Jamie Shah</strong><span>Attorney</span></div></div></header><div class="detail-wrap"><button class="back-link" data-admin>← Back to My Leads</button><div class="detail-title"><div><div class="eyebrow">Lead · 7c3f…9a2</div><h2>Maya Patel</h2><div style="display:flex;gap:8px">${status("PENDING")}<span class="duplicate">2 previous submissions</span></div></div><button class="primary">Mark reached out</button></div><div class="detail-grid"><section class="panel"><h3>Prospect information</h3>${detailCore()}</section><aside class="panel"><div class="section-title">Assigned attorney</div><div class="person" style="margin-bottom:30px"><span class="avatar">JS</span><div><strong>Jamie Shah</strong><span>Primary contact</span></div></div><div class="section-title">Status history</div><div class="timeline"><div class="timeline-item"><span class="timeline-dot"></span><strong class="small">Submitted · Pending</strong><div class="tiny muted">System · Today, 9:18 AM</div></div></div></aside></div></div></main>`;
      }

      function detailB() {
        return `<main class="surface-shell b-detail"><section class="b-detail-card"><article class="b-detail-main"><button class="back-link" data-admin>← My Leads</button><div class="eyebrow">Lead details</div><h2 style="margin:8px 0">Maya Patel</h2><div style="display:flex;gap:8px;margin-bottom:30px">${status("REACHED_OUT")}<span class="duplicate">2 previous submissions</span></div>${detailCore()}</article><aside class="b-detail-side"><div class="section-title">Primary action</div><button class="primary button-wide" style="margin-bottom:26px">Move back to pending</button><div class="section-title">Assigned attorney</div><div class="person" style="margin-bottom:32px"><span class="avatar">JS</span><div><strong>Jamie Shah</strong><span>Accountable owner</span></div></div><div class="section-title">Status history</div>${compactTimeline()}</aside></section></main>`;
      }

      function detailC() {
        return `<main class="surface-shell c-detail"><header class="c-admin-header">${logo()}<button class="back-link" style="margin:0" data-admin>← Return to queue</button><span class="avatar">JS</span></header><div class="c-detail-inner"><div class="detail-title"><div><div class="eyebrow">Lead dossier</div><h2>Maya Patel</h2></div><button class="primary">Mark reached out</button></div><div class="c-dossier"><aside class="profile-panel"><div class="profile-initials">MP</div><div class="data-label">Email</div><div class="data-value">maya.patel@example.com</div><div class="data-label">Assignment</div><div class="data-value">Jamie Shah</div><div class="data-label">Submitted</div><div class="data-value">Today, 9:18 AM</div><div class="data-label">Status</div><div style="margin-top:7px">${status("PENDING")}</div></aside><section class="dossier-main"><div class="panel"><h3>Documents</h3><div class="resume-card" style="margin-top:0"><span class="doc-icon">PDF</span><div style="flex:1"><strong class="small">Maya_Patel_CV.pdf</strong><div class="tiny muted">Secure private document · 1.8 MB</div></div><button class="ghost">Download</button></div></div><div class="panel"><h3>Possible duplicates</h3><p class="small muted">Two earlier Leads share this normalized email.</p><div class="info-list"><div class="info-row"><span>July 18, 2026</span><strong>Reached out →</strong></div><div class="info-row"><span>March 2, 2026</span><strong>Pending →</strong></div></div></div><div class="panel"><h3>Status history</h3><div class="timeline"><div class="timeline-item"><span class="timeline-dot"></span><strong class="small">Submitted · Pending</strong><div class="tiny muted">System · Today, 9:18 AM</div></div></div></div></section></div></div></main>`;
      }

      function successToast() { return `<div class="success-toast" role="status"><strong>Submission received</strong><div class="small" style="margin-top:4px;color:rgba(255,255,255,.78)">An attorney will review your information and contact you soon.</div></div>`; }

      function switcher() {
        const names = { public: "Public intake", admin: "Attorney workspace", detail: "Lead detail" };
        return `<div class="prototype-switcher" aria-label="Prototype controls"><button class="switch-arrow" data-prev-variant aria-label="Previous variant">←</button><div class="switch-copy"><strong>${variant} — ${variants[variant].name}</strong><span>${variants[variant].description}</span></div><button class="switch-arrow" data-next-variant aria-label="Next variant">→</button><div class="surface-tabs">${surfaces.map((key) => `<button class="surface-tab ${surface === key ? "active" : ""}" data-surface="${key}">${names[key]}</button>`).join("")}</div></div>`;
      }

      function render() {
        const templates = {
          public: { A: publicA, B: publicB, C: publicC },
          admin: { A: adminA, B: adminB, C: adminC },
          detail: { A: detailA, B: detailB, C: detailC },
        };
        document.getElementById("app").innerHTML = `${templates[surface][variant]()}${switcher()}`;
        wireInteractions();
      }

      function navigate(nextVariant = variant, nextSurface = surface) {
        variant = nextVariant;
        surface = nextSurface;
        const url = new URL(window.location);
        url.searchParams.set("variant", variant);
        url.searchParams.set("surface", surface);
        history.replaceState({}, "", url);
        render();
      }

      function cycle(direction) {
        const keys = Object.keys(variants);
        const current = keys.indexOf(variant);
        navigate(keys[(current + direction + keys.length) % keys.length], surface);
      }

      function wireInteractions() {
        document.querySelector("[data-prev-variant]")?.addEventListener("click", () => cycle(-1));
        document.querySelector("[data-next-variant]")?.addEventListener("click", () => cycle(1));
        document.querySelectorAll("[data-surface]").forEach((button) => button.addEventListener("click", () => navigate(variant, button.dataset.surface)));
        document.querySelectorAll("[data-detail]").forEach((item) => item.addEventListener("click", () => navigate(variant, "detail")));
        document.querySelectorAll("[data-admin]").forEach((item) => item.addEventListener("click", () => navigate(variant, "admin")));
        document.querySelector("[data-next-step]")?.addEventListener("click", () => {
          document.querySelector('[data-step="1"]').hidden = true;
          document.querySelector('[data-step="2"]').hidden = false;
          document.querySelector('[data-step-label="1"]').classList.remove("active");
          document.querySelector('[data-step-label="2"]').classList.add("active");
        });
        document.querySelector("[data-prev-step]")?.addEventListener("click", () => {
          document.querySelector('[data-step="2"]').hidden = true;
          document.querySelector('[data-step="1"]').hidden = false;
          document.querySelector('[data-step-label="2"]').classList.remove("active");
          document.querySelector('[data-step-label="1"]').classList.add("active");
        });
        document.querySelector("[data-form]")?.addEventListener("submit", (event) => {
          event.preventDefault();
          document.body.insertAdjacentHTML("beforeend", successToast());
          setTimeout(() => document.querySelector(".success-toast")?.remove(), 3200);
        });
      }

      document.addEventListener("keydown", (event) => {
        if (["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName) || document.activeElement?.isContentEditable) return;
        if (event.key === "ArrowLeft") cycle(-1);
        if (event.key === "ArrowRight") cycle(1);
      });
      window.addEventListener("popstate", () => {
        const next = new URLSearchParams(window.location.search);
        variant = variants[next.get("variant")] ? next.get("variant") : "A";
        surface = surfaces.includes(next.get("surface")) ? next.get("surface") : "public";
        render();
      });
      render();
    </script>
  </body>
</html>
