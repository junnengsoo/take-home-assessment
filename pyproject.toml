[project]
name = "lead-intake-platform"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "asyncpg==0.30.0",
  "fastapi==0.115.8",
  "httpx==0.28.1",
  "python-multipart==0.0.20",
  "pydantic-settings==2.8.1",
  "uvicorn[standard]==0.34.0"
]

[dependency-groups]
dev = [
  "pytest==8.3.5",
  "pytest-asyncio==0.25.3",
  "ruff==0.9.9"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["services/api", "services/worker"]
testpaths = ["services/api/tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
